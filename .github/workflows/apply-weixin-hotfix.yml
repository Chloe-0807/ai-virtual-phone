name: Apply Weixin compatibility hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-weixin-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested compatibility patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/weixin-hotfix.patch
          git apply --check /tmp/weixin-hotfix.patch
          git apply /tmp/weixin-hotfix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/weixin/route.ts components/settings/weixin-settings.tsx lib/weixin-bridge.ts lib/weixin-storage.ts tools/weixin-local-assistant/assistant-core.mjs public/weixin-local-assistant/assistant-core.mjs public/weixin-local-assistant/cloud-function.mjs supabase/functions/weixin-assistant/index.ts
          git commit -m "fix(weixin): support current iLink login routing"
          git push
